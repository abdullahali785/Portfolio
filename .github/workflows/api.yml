name: API Test — Fetch PR Files

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch changed files and post/update comment
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            console.log(`Changed files: ${files.length}`);
            for (const file of files) {
              console.log(`\n--- ${file.filename} (${file.status}) ---`);
              console.log(file.patch);
            }

            const marker = '<!-- ai-pr-review-bot -->';
            const body = `${marker}\n🤖 Test comment: this PR changes ${files.length} file(s). (updated: ${new Date().toISOString()})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              console.log(`Found existing comment (id: ${existing.id}) — updating.`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              console.log('No existing comment — creating new one.');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }